# Baltic & Nordic Art Auction Sources
# Each entry represents an auction house with published historical results

sources:
  # === ESTONIA ===
  - name: Haus Galerii
    slug: haus
    country: EE
    url: https://haus.ee
    status: active
    lots_estimate: 5000
    year_range: [1998, 2026]
    description: >
      One of Estonia's leading auction houses, hosting spring and autumn
      fine art auctions in Tallinn since 1998. Specialises in Estonian
      classical and contemporary paintings, graphics, and sculpture.

  - name: Allee Galerii
    slug: allee
    country: EE
    url: https://galeriiallee.ee
    status: active
    lots_estimate: 2500
    year_range: [2020, 2026]
    description: >
      Tallinn-based gallery dedicated to Estonian art auctions and
      exhibitions. Runs seasonal auctions featuring paintings, graphics,
      and applied art from Estonia's most prominent artists.

  - name: Vaal Galerii
    slug: vaal
    country: EE
    url: https://vaal.ee
    status: active
    lots_estimate: 1900
    year_range: [2001, 2026]
    description: >
      The first private gallery in Estonia, active since 1990. Promotes
      Estonian modern art through exhibitions and regular auctions.
      Features works from both established and emerging Baltic artists.

  - name: Vernissage Galerii
    slug: vernissage
    country: EE
    url: https://vernissage.ee
    status: active
    lots_estimate: 1700
    year_range: [2021, 2026]
    description: >
      Estonian art gallery and auction house offering spring and autumn
      sales of fine art, classical paintings, and graphics. Known for
      curated selections of Estonian older and modern masters.

  - name: Art & Tonic
    slug: artandtonic
    country: EE
    url: https://artandtonic.art
    status: active
    lots_estimate: 50
    year_range: [2020, 2020]
    description: >
      Contemporary art gallery in Tallinn focused on stimulating the
      Estonian art market and supporting artists' income. Organises
      curated auctions of contemporary Estonian artwork.

  - name: E-Kunstisalong
    slug: salong
    country: EE
    url: https://www.e-kunstisalong.ee
    status: active
    lots_estimate: 350
    year_range: [2009, 2026]
    description: >
      Tartu-based gallery opened in 1997, hosting over 57 art auctions.
      Features Estonian paintings, graphics, and sculpture with a focus
      on making art accessible to a broad audience.

  # === LATVIA ===
  - name: Antonija Classic Art Gallery
    slug: antonija
    country: LV
    url: https://www.antonia.lv
    status: active
    lots_estimate: 15000
    year_range: [2008, 2026]
    description: >
      Latvia's largest classic art gallery, active since 1991 in Riga.
      Hosts 148+ online auctions featuring Latvian and Baltic fine art,
      decorative arts, and antiques. Located in a historic Art Nouveau
      building on Alberta Street.

  # === LITHUANIA ===
  - name: Menorinka / Vilniaus Aukcionas
    slug: menorinka
    country: LT
    url: https://www.menorinka.lt
    status: planned
    lots_estimate: 10000
    year_range: [2007, 2026]
    description: >
      Lithuania's oldest operating auction house, established in Vilnius.
      Conducts 90+ art auctions since 2007, specialising in Lithuanian
      and Baltic fine art, graphics, and applied art.

  - name: ARS VIA Aukcionas
    slug: arsvia
    country: LT
    url: https://arsvia.lt
    status: planned
    lots_estimate: 5000
    year_range: [2017, 2026]
    description: >
      Lithuanian art and collectibles auction house hosting regular sales
      of fine art, antiques, and cultural valuables. Over 50 auctions
      since 2017 with published results.

  # === FINLAND ===
  - name: Hagelstam & Co
    slug: hagelstam
    country: FI
    url: https://www.hagelstam.fi
    status: active
    lots_estimate: 162000
    year_range: [2000, 2026]
    description: >
      Finland's oldest auction house, founded in 1979 by Wenzel Hagelstam.
      A household name in Finnish art auctioneering with monthly sales
      covering fine art, design, jewellery, and antiques. Over 160,000
      lots in their completed auctions archive.

  - name: Bukowskis
    slug: bukowskis
    country: FI
    url: https://www.bukowskis.com
    status: active
    lots_estimate: 5000
    year_range: [2020, 2026]
    description: >
      Founded in Stockholm in 1870 by Henryk Bukowski, one of the Nordic
      region's leading fine art and quality auction houses. Operates in
      both Stockholm and Helsinki, specialising in Nordic fine art,
      design, and contemporary works.

  # === SWEDEN ===
  - name: Auctionet
    slug: auctionet
    country: SE
    url: https://auctionet.com
    status: active
    lots_estimate: 50000
    year_range: [2015, 2026]
    description: >
      Scandinavia's leading online auction platform, founded in 2011.
      Partners with major auction houses including Stockholms Auktionsverk
      and Uppsala Auktionskammare. Over 4 million ended lots across
      art, design, antiques, and collectibles.

  - name: Stockholms Auktionsverk
    slug: stockholms_auktionsverk
    country: SE
    url: https://stockholmsauktionsverk.com
    status: active
    lots_estimate: 150000
    year_range: [2002, 2026]
    description: >
      The world's oldest auction house, founded in 1674. Now owned by
      Auctionet Group. Enormous online archive of past auction results
      covering fine art, design, and antiques. Server-rendered HTML
      archive at /arkiv/online/kategori/konst.

  # === DENMARK ===
  - name: Bruun Rasmussen
    slug: bruun_rasmussen
    country: DK
    url: https://bruun-rasmussen.dk
    status: active
    lots_estimate: 75000
    year_range: [2012, 2026]
    description: >
      Denmark's largest and most prestigious auction house, renowned
      for sales of fine art, design, and luxury goods. Handles over
      75,000 items per year across live and online auctions in Copenhagen.

  - name: Lauritz.com
    slug: lauritz
    country: DK
    url: https://www.lauritz.com
    status: active
    lots_estimate: 60000
    year_range: [1999, 2026]
    description: >
      Northern Europe's largest online auction house, originally
      established in 1885. Online since 1999 with ~5,000 hammer prices
      per month. Operates 8 departments across Denmark. Protected by
      Cloudflare, requires stealth browser for scraping.

  # === NORWAY ===
  - name: Grev Wedels Plass Auksjoner
    slug: gwpa
    country: "NO"
    url: https://gwpa.no
    status: active
    lots_estimate: 5000
    year_range: [1994, 2026]
    description: >
      Norway's premier fine art auction house, located at Bankplassen
      in Oslo. Operating since 1994 with a focus on Norwegian and Nordic
      paintings, drawings, and sculpture from the 19th century to present.

  - name: Christiania Auksjoner
    slug: christiania
    country: "NO"
    url: https://christiania-auksjoner.no
    status: planned
    lots_estimate: 5000
    year_range: [2009, 2026]
    description: >
      One of Norway's oldest and most respected auction houses, established
      in 1932. Specialises in quality auctions of fine art, antiques,
      and design with seasonal sales in Oslo.

  # === NETHERLANDS ===
  - name: Kunstveiling.nl
    slug: kunstveiling
    country: NL
    url: https://www.kunstveiling.nl
    status: active
    lots_estimate: 500000
    year_range: [2010, 2026]
    description: >
      The Netherlands' largest online art and design auction platform.
      Hosts weekly themed auctions with over 500,000 items sold. Features
      paintings, sculpture, photography, and design from Dutch and
      international artists.

  # === UK ===
  - name: Bonhams
    slug: bonhams
    country: GB
    url: https://www.bonhams.com
    status: active
    lots_estimate: 100000
    year_range: [2000, 2026]
    description: >
      One of the world's oldest and largest auctioneers of fine art and
      antiques, founded in London in 1793. Conducts sales globally
      across fine art, jewellery, motor cars, and luxury collectibles
      with salerooms in London, New York, Hong Kong, and Los Angeles.
